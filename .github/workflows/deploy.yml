name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual run from the Actions tab without pushing a commit.
  workflow_dispatch:

# GITHUB_TOKEN needs to be able to publish a Pages artifact and claim the
# deployment. Nothing here needs write access to repository contents.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it; queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        # GITHUB_PAGES flips next.config.mjs into `output: 'export'` and
        # applies the /Tidepool basePath. Without it the build emits a
        # server bundle that Pages cannot run.
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
